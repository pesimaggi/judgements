name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # `postinstall` runs `prisma generate`, which needs the schema but not a
      # database. Nothing in the test suite connects to one: the tests cover
      # the parsers and pure functions, and the fixtures are frozen responses.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # The answer evaluation, in its offline mode: it replays the recorded
      # runs in src/ask-eval/fixtures.json through the real pipeline against a
      # fake model, so it needs neither an API key nor a database. It exits
      # non-zero on a failed fixture, which is the point of having it here —
      # a change to citation validation or to the prompt's rules is measured
      # on every pull request rather than the next time somebody looks.
      - run: npm run eval:ask

      # Public browsing and contextual login must work even before Clerk keys
      # are configured. Fixture APIs keep these checks independent of Postgres.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

      # `npm run lint` is deliberately not here yet: ESLint has never been
      # configured in this repo, so `next lint` prompts for a config and would
      # hang the job. Configure it, then add the step.

  database-deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: logbrunnur_deploy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d logbrunnur_deploy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/logbrunnur_deploy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Recreate the legacy SQL-managed dictionary and populated search vectors,
      # then run the real Railway pre-deploy command twice without data loss.
      - run: node --import tsx scripts/test-db-deploy.ts
